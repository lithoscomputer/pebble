[package]
name = "pebble-coding-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Coding-agent library built on pebble-agent"

[features]
# Test doubles (`pebble_coding_agent::test_support`) for embedding applications.
test-util = []
# `pebble_coding_agent::search::providers`: Brave and Venice web search over
# their public HTTP APIs, for an application that would rather not write them.
search-providers = ["dep:reqwest"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
lithos-llm = { workspace = true, features = ["runtime"] }
pebble-agent = { path = "../pebble-agent" }
# The search providers' transport. lithos-llm already builds this version with
# these features and more for its own runtime, so it adds nothing to the
# lockfile; the application's client is what a provider is given.
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "rustls",
], optional = true }
serde.workspace = true
serde_json.workspace = true
# Deterministic todo identities: a whole-list tool identifies an item by its
# text, so the id is a hash of it. Pinned to the version lithos-llm already
# resolves, along with every crate underneath it.
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1.18.1", features = ["v4"] }

# Signalling a command's process group without writing unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
# Concrete integrations belong to the example and provider-profile tests.
lithos-llm = { workspace = true, features = [
  "runtime",
  "builtin-catalog",
  "openai",
  "anthropic",
  "gemini",
  "openai-compatible",
  "environment-credentials",
] }
# The search providers are tested against a fake engine served in the test
# process, the way the CLI cases are answered by twin-openai. Already in the
# lockfile for those cases.
axum = "0.8"
insta = { version = "1.48.0", features = ["json"] }
# `start_paused` test runtimes, so a test that waits out a retry delay does not
# actually wait, the multi-threaded runtime the example's `#[tokio::main]`
# asks for, and the listener the fake search engine binds. Adds no package to
# the lockfile: tokio is already a dependency.
tokio = { version = "1.49.0", features = ["net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

[[example]]
name = "embedding"
required-features = ["test-util"]
