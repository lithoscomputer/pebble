[package]
name = "pebble-cli-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The pebble command line as a library: the exec session, its renderer and approval prompt, and the interactive session"

[lib]
doctest = false

[dependencies]
anyhow = "1.0.104"
async-trait.workspace = true
base64 = "=0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
crossterm = "=0.29.0"
futures-util.workspace = true
fs2 = "=0.4.3"
humantime = "2.2.0"
# Every adapter the built-in catalog names, so no provider is reported as
# unavailable at startup.
lithos-llm = { workspace = true, features = [
  "runtime",
  "builtin-catalog",
  "environment-credentials",
  "anthropic",
  "gemini",
  "openai",
  "openai-compatible",
] }
pebble-coding-agent = { path = "../pebble-coding-agent" }
pebble-agent = { path = "../pebble-agent" }
serde.workspace = true
serde_json.workspace = true
similar = "=2.7.0"
tempfile = "=3.27.0"
termimad = "=0.34.1"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.2"
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[lints]
workspace = true
