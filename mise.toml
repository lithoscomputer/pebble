min_version = "2026.6.11"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
minimum_release_age = "24h"

[tools]
"cargo:cargo-nextest" = { version = "0.9.140", locked = true }
rust = [
  { version = "1.97.1", profile = "minimal", components = ["clippy"] },
  { version = "1.88.0", profile = "minimal" },
  { version = "nightly-2026-04-14", profile = "minimal", components = ["rustfmt"] },
]
zizmor = "1.29.0"

[tasks.setup]
description = "Prepare the pinned Rust style guide"
run = "bin/style-guides prepare"

[tasks.dev]
description = "Run the coding-agent example against a live provider"
run = "cargo run --locked -p pebble-coding-agent --example coding_agent"

[tasks.fmt]
description = "Format Rust with the pinned nightly formatter"
run = "cargo +nightly-2026-04-14 fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo +nightly-2026-04-14 fmt --check --all"

[tasks.lint]
description = "Lint all Rust targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/clippy" }
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all Rust tests with Nextest"
run = "cargo nextest run --locked --workspace --all-targets --all-features --no-tests=pass"

[tasks."test:doc"]
description = "Run the documentation tests, which Nextest does not cover"
run = "cargo test --doc --locked --workspace --all-features"

[tasks.doc]
description = "Build the API documentation with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/doc-check", RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --locked --workspace --all-features"

[tasks."test:release"]
description = "Run all Rust tests in release mode"
run = "cargo nextest run --locked --release --workspace --all-targets --all-features --no-tests=pass"

[tasks."check:msrv"]
description = "Check all targets with the declared minimum Rust version"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/msrv" }
run = "cargo +1.88.0 check --locked --workspace --all-targets --all-features"

[tasks."check:actions"]
description = "Audit GitHub Actions workflows"
run = "zizmor .github/workflows"

[tasks."check:whitespace"]
description = "Check tracked and untracked work for whitespace errors"
run = "bin/check-whitespace"

[tasks.check]
description = "Run the complete routine verification gate"
depends = [
  "fmt:check",
  "lint",
  "test",
  "test:doc",
  "doc",
  "check:actions",
  "check:whitespace",
]

[tasks."check:nightly"]
description = "Run the extended nightly verification gate"
depends = ["check", "check:msrv", "test:release"]
