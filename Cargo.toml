[package]
name = "pebble"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
# Test doubles (`pebble::test_support`) for applications that embed pebble.
test-util = []

[dependencies]
async-trait = "0.1.89"
futures-util = "0.3.32"
lithos-llm = { path = "../lithos-llm" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.49.0", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }
tokio-util = "0.7.19"
tracing = "0.1.41"
# Session identifiers. Pinned to the version lithos-llm already resolves, so
# the shared lockfile gains no entry.
uuid = { version = "1.18.1", features = ["v4"] }

# Signalling a command's process group without writing unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
# `start_paused` test runtimes, so a test that waits out a retry delay does not
# actually wait. Adds no package to the lockfile: tokio is already a dependency.
tokio = { version = "1.49.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes_without_reason = "warn"

implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"

print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
disallowed_methods = "deny"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
wildcard_imports = "warn"
absolute_paths = "warn"
